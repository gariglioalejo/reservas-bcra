name: Deploy to GitHub Pages

# Publica el sitio con la fuente "GitHub Actions" de Pages.
# El paso actions/configure-pages con enablement: true habilita Pages
# automáticamente con el token del propio repositorio, sin necesidad
# de permisos extra en ningún token personal.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update reserves snapshot"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages (y habilitar si hace falta)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
