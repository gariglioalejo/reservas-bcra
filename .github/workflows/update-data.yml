name: Update reserves snapshot

on:
  schedule:
    # 11:30 y 21:30 UTC, después de las publicaciones diarias del BCRA
    - cron: "30 11,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch latest reserves
        run: python3 scripts/update_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data.json; then
            echo "Sin cambios en data.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "data: actualizar snapshot de reservas del BCRA"
          git push
